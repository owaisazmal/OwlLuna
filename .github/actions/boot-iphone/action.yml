name: Boot an iPhone simulator
description: Boots an iPhone on the newest iOS runtime that has the one asked for, and sets SIMULATOR_UDID.

inputs:
  device:
    description: "`duo` for an iPhone Duo, or another iPhone when there is none; `iphone` for an iPhone 17, or another iPhone that isn't a Duo."
    default: duo

outputs:
  udid:
    description: The booted simulator; empty when the runner has no iOS runtime.
    value: ${{ steps.boot.outputs.udid }}

runs:
  using: composite
  steps:
    - id: boot
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        runtimes=$(xcrun simctl list runtimes available --json)
        devices=$(xcrun simctl list devices available --json)
        candidates=$(jq -r '
          [.runtimes[] | select(.platform == "iOS")]
          | sort_by(.version | split(".") | map(tonumber)) | reverse | .[].identifier' <<< "$runtimes")
        if [ -z "$candidates" ]; then
          echo "udid=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The Duo has the vertical bar the folded layouts are built for; any other iPhone has the top bar and tray.
        pick='def pick($want): map(select(.name | startswith("iPhone")))
          | if $want == "duo" then map(select(.name == "iPhone Duo")) + .
            else map(select(.name == "iPhone 17")) + map(select(.name != "iPhone Duo")) end;'
        runtime=
        for candidate in $candidates; do
          udid=$(jq -r --arg runtime "$candidate" --arg want "$DEVICE" "$pick"'
            .devices[$runtime] // [] | pick($want) | first | .udid // empty' <<< "$devices")
          type=$(jq -r --arg runtime "$candidate" --arg want "$DEVICE" "$pick"'
            .runtimes[] | select(.identifier == $runtime) | .supportedDeviceTypes
            | pick($want) | first | .identifier // empty' <<< "$runtimes")
          if [ -n "$udid" ] || [ -n "$type" ]; then
            runtime=$candidate
            break
          fi
        done
        if [ -z "$runtime" ]; then
          echo "::error::No iOS runtime on this runner has an iPhone for '$DEVICE' ($(echo $candidates))."
          exit 1
        fi
        if [ -z "$udid" ]; then
          udid=$(xcrun simctl create "CI iPhone" "$type" "$runtime")
        fi
        echo "Booting $(xcrun simctl list devices --json | jq -r --arg udid "$udid" '.devices[][] | select(.udid == $udid) | .name') on $runtime"
        xcrun simctl boot "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
