name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Xcode the app is built and archived with; the image's default is 27.1. ci.yml uses the same.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  archive:
    name: Release archive
    # Unsigned, so it needs no secrets. It checks a tag before anything is uploaded or published.
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the archive, so a build's tag with no section in the changelog fails in seconds.
      - name: Check the changelog
        if: github.ref_type == 'tag' && contains(github.ref_name, '-build.')
        run: python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OwlLuna.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/archive.log" \
            | xcbeautify --renderer github-actions

      - name: Check the version
        id: version
        run: |
          app="$RUNNER_TEMP/OwlLuna.xcarchive/Products/Applications/OwlLuna.app"
          for key in CFBundleShortVersionString CFBundleVersion; do
            mine=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")
            widgets=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/PlugIns/OwlLunaWidgets.appex/Info.plist")
            if [ "$mine" != "$widgets" ]; then
              echo "::error::The widgets' $key is $widgets, but the app's is $mine. Set both targets to the same."
              exit 1
            fi
          done
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          IFS=. read -r major minor patch <<< "$version"
          tag="v$major.${minor:-0}.${patch:-0}"
          # A TestFlight build is tagged with its build number; the build that goes to the App Store also gets the plain version.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag-build.$build" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The app is $version (build $build), so its tag is $tag-build.$build, or $tag for the App Store, not $GITHUB_REF_NAME."
            exit 1
          fi
          echo "OwlLuna $version (build $build) archived from ${GITHUB_SHA:0:7}." >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT=OwlLuna-$version-build-$build-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Zip the archive
        run: ditto -c -k --keepParent "$RUNNER_TEMP/OwlLuna.xcarchive" "$RUNNER_TEMP/OwlLuna.xcarchive.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/OwlLuna.xcarchive.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: archive-log
          retention-days: 14
          path: ${{ runner.temp }}/archive.log

  testflight:
    name: TestFlight upload
    needs: archive
    # Off until the TESTFLIGHT_UPLOAD variable is true (see RELEASING.md). The App Store's tag names a build already uploaded.
    if: github.ref_type == 'tag' && contains(github.ref_name, '-build.') && vars.TESTFLIGHT_UPLOAD == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    # Holds the App Store Connect key, and waits for its reviewer before any step runs.
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The testflight environment needs the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8. See RELEASING.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Signed for the team in Config/Signing.xcconfig, with certificates and profiles managed through the key.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OwlLuna.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" \
            | xcbeautify --renderer github-actions

      - name: Upload to TestFlight
        env:
          VERSION: ${{ needs.archive.outputs.version }}
          BUILD: ${{ needs.archive.outputs.build }}
        run: |
          set -o pipefail
          options="$RUNNER_TEMP/export.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert signingStyle -string automatic "$options"
          # The tag names this build, so Xcode must not give it another number.
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OwlLuna.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"
          echo "OwlLuna $VERSION (build $BUILD) uploaded to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Not kept as artifacts: xcodebuild's log starts with its command line, and so with the key's IDs. Here they are masked.
      - name: Show the end of the logs
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/upload.log" || true

  publish:
    name: GitHub Release
    needs: [archive, testflight]
    # After the upload where there is one. Where it is off, the build was uploaded from Xcode before its tag was pushed.
    if: >-
      ${{ !cancelled() && github.ref_type == 'tag' && contains(github.ref_name, '-build.')
      && needs.archive.result == 'success'
      && (needs.testflight.result == 'success' || needs.testflight.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A TestFlight build is a prerelease with its changelog section as the notes. The App Store's release is made by hand.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.archive.outputs.version }}
          BUILD: ${{ needs.archive.outputs.build }}
        run: |
          python3 .github/scripts/release-notes.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already has a release, which is left as it is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "OwlLuna $VERSION (build $BUILD)" --notes-file "$RUNNER_TEMP/notes.md"
