name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'LICENSE'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      ui-suite:
        description: Run the whole UI suite
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build for testing
    # Xcode 27 preview image. There is no macos-27 label yet (October 2026); switch once it is generally available.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Built once for every test job. A generic destination keeps every device's assets; ARCHS keeps it to this Mac's.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build-for-testing \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -showBuildTimingSummary \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" \
            | xcbeautify --renderer github-actions

      # Artifacts drop file modes, so the products travel as a tar.
      - name: Pack the products
        run: tar -cf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP/DerivedData/Build" Products

      - uses: actions/upload-artifact@v7
        with:
          name: products
          path: ${{ runner.temp }}/products.tar
          retention-days: 3
          if-no-files-found: error
          overwrite: true

      - name: Report
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log
          retention-days: 14
          path: ${{ runner.temp }}/build.log

  test:
    name: Tests (${{ matrix.name }})
    needs: build
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      # So the log of a run that is stopped keeps its last lines.
      NSUnbufferedIO: 'YES'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPadOS latest
            ipad: latest
          - name: iPadOS 18
            ipad: '18'
          - name: iPhone Duo
            iphone: duo
          - name: iPhone
            iphone: iphone
    steps:
      - uses: actions/checkout@v7

      - name: Boot an iPad simulator
        if: matrix.ipad
        uses: ./.github/actions/boot-ipad
        with:
          ios: ${{ matrix.ipad }}

      - name: Boot an iPhone simulator
        if: matrix.iphone
        uses: ./.github/actions/boot-iphone
        with:
          device: ${{ matrix.iphone }}

      - name: Check for the runtime
        if: env.SIMULATOR_UDID == ''
        env:
          IOS: ${{ matrix.ipad }}
        run: |
          xcodebuild -version
          runtimes=$(xcrun simctl list runtimes available | grep '^iOS' | cut -d' ' -f1-2 | paste -sd, - | sed 's/,/, /g' || true)
          if [ -z "$IOS" ] || [ "$IOS" = latest ]; then
            echo "::error::No iOS simulator runtime is available on this runner."
            exit 1
          fi
          echo "::notice title=iPadOS $IOS skipped::This runner image has no iOS $IOS simulator runtime (it has ${runtimes:-none})."

      - uses: actions/download-artifact@v8
        if: env.SIMULATOR_UDID != ''
        with:
          name: products
          path: ${{ runner.temp }}

      - name: Unpack the products
        id: products
        if: env.SIMULATOR_UDID != ''
        run: |
          tar -xf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        if: steps.products.outcome == 'success'
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Unit tests
        if: steps.products.outcome == 'success'
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/Unit.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: UI smoke test
        if: steps.products.outcome == 'success'
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaUITests/SliceUITests/testVerticalSlice \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/Smoke.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log" \
            | xcbeautify --renderer github-actions

      - name: Report
        if: always() && steps.products.outcome == 'success'
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.ipad && format('ipados-{0}', matrix.ipad) || matrix.iphone }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult

  release:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build Release with warnings as errors
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/release.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-build-log
          retention-days: 14
          path: ${{ runner.temp }}/release.log

  nightly-check:
    name: Nightly check
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ui-suite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ui-suite: ${{ steps.check.outputs.ui-suite }}
    steps:
      # A nightly skips the UI suite when it passed on this commit in the last week; any API error runs it.
      - name: Check the last nightly on this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            get() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/$1"; }
            since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            ids=$(get "workflows/ci.yml/runs?event=schedule&status=completed&head_sha=$GITHUB_SHA&per_page=20" \
              | jq -r --arg since "$since" '.workflow_runs[] | select(.created_at >= $since) | .id') || ids=
            for id in $ids; do
              ui=$(get "runs/$id/jobs?filter=latest&per_page=100" | jq -r '
                [.jobs[] | select(.name | startswith("UI suite")) | .conclusion]
                | if all(. == "skipped") then "skipped" elif all(. == "success") then "passed" else "failed" end') || break
              [ "$ui" = skipped ] && continue
              if [ "$ui" = passed ]; then
                run=false
                echo "::notice title=UI suite skipped::It passed on ${GITHUB_SHA:0:7} in run $id. Run the workflow by hand to repeat it."
              fi
              break
            done
          fi
          echo "ui-suite=$run" >> "$GITHUB_OUTPUT"

  ui-suite:
    name: UI suite (${{ matrix.part }})
    needs: [build, nightly-check]
    if: needs.nightly-check.outputs.ui-suite == 'true'
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      NSUnbufferedIO: 'YES'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each line of `runs` is one xcodebuild run. A run that fails is tried once more in a fresh test runner on a
          # rebooted simulator: a runner session that has gone slow waits a minute for the app to go idle on every step.
          - part: tests
            runs: |
              -only-testing:OwlLunaUITests -skip-testing:OwlLunaUITests/AccessibilityAuditUITests
            allowance: 900
            appearance: light
          # The simulator ignores XCUIDevice's appearance switch, so each part sets it before the tests start.
          - part: audits-light
            runs: |
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLight
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLightIncreaseContrast
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLargeText
            allowance: 2700
            appearance: light
          - part: audits-dark
            runs: |
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDark
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDarkIncreaseContrast
            allowance: 2700
            appearance: dark
    steps:
      - uses: actions/checkout@v7

      - name: Boot an iPad simulator
        uses: ./.github/actions/boot-ipad

      - uses: actions/download-artifact@v8
        with:
          name: products
          path: ${{ runner.temp }}

      - name: Unpack the products
        run: |
          test -n "$SIMULATOR_UDID" || { echo "::error::No iOS simulator runtime is available on this runner."; exit 1; }
          tar -xf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Set the appearance
        run: xcrun simctl ui "$SIMULATOR_UDID" appearance ${{ matrix.appearance }}

      - name: UI tests
        env:
          RUNS: ${{ matrix.runs }}
          ALLOWANCE: ${{ matrix.allowance }}
          APPEARANCE: ${{ matrix.appearance }}
        run: |
          set -o pipefail
          failed=0
          number=0
          while IFS= read -r selection; do
            [ -n "$selection" ] || continue
            number=$((number + 1))
            for attempt in 1 2; do
              if [ "$attempt" = 2 ]; then
                echo "::warning title=UI run $number tried again::The first run failed, so it runs once more in a fresh test runner on a rebooted simulator."
                xcrun simctl shutdown "$SIMULATOR_UDID"
                xcrun simctl boot "$SIMULATOR_UDID"
                xcrun simctl bootstatus "$SIMULATOR_UDID"
                xcrun simctl ui "$SIMULATOR_UDID" appearance "$APPEARANCE"
              fi
              if xcodebuild test-without-building \
                -xctestrun "$XCTESTRUN" \
                -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
                $selection \
                -parallel-testing-enabled NO \
                -retry-tests-on-failure -test-iterations 2 \
                -test-timeouts-enabled YES -default-test-execution-time-allowance "$ALLOWANCE" \
                -resultBundlePath "$RUNNER_TEMP/UI-$number-$attempt.xcresult" \
                2>&1 | tee "$RUNNER_TEMP/ui-$number-$attempt.log" \
                | xcbeautify --renderer github-actions; then
                break
              fi
              [ "$attempt" = 2 ] && failed=1
            done
          done <<< "$RUNS"
          exit $failed

      - name: Report
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-${{ matrix.part }}-results
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/UI.xcresult
