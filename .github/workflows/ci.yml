name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/release-notes.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/lint.yml'
      - '.github/actionlint.yaml'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/release-notes.py'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/lint.yml'
      - '.github/actionlint.yaml'
      - 'LICENSE'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      ui-suite:
        description: Run the whole UI suite
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Xcode the app is built and archived with; the image's default is 27.1. release.yml uses the same.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    name: Build for testing
    # A night whose jobs already passed on this commit builds nothing.
    needs: nightly-check
    if: ${{ !cancelled() && needs.nightly-check.outputs.nightly != 'false' }}
    # Xcode 27 preview image. There is no macos-27 label yet (November 2026); switch once it is generally available.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built once for every test job. A generic destination keeps every device's assets; ARCHS keeps it to this Mac's.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build-for-testing \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -showBuildTimingSummary \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" \
            | xcbeautify --renderer github-actions

      # Artifacts drop file modes, so the products travel as a tar.
      - name: Pack the products
        run: tar -cf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP/DerivedData/Build" Products

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: products
          path: ${{ runner.temp }}/products.tar
          retention-days: 3
          if-no-files-found: error
          overwrite: true

      - name: Report
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: build-log
          retention-days: 14
          path: ${{ runner.temp }}/build.log

  test:
    name: Tests (${{ matrix.name }})
    needs: build
    # A nightly's commit already ran these when it was pushed.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'schedule' }}
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      # So the log of a run that is stopped keeps its last lines.
      NSUnbufferedIO: 'YES'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPad
            device: ipad
          - name: iPhone Duo
            device: duo
          - name: iPhone
            device: iphone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the simulator boots: its first boot keeps the runner busy, and the download then takes minutes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: products
          path: ${{ runner.temp }}

      - name: Boot the simulator
        run: python3 .github/scripts/boot-simulator.py ${{ matrix.device }}

      - name: Unpack the products
        run: |
          tar -xf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        id: ready
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      # On a slow runner a different test misses a deadline each time, so a test fails the job only if it fails twice:
      # run-tests.py runs what failed once more in a fresh test runner, and the report lists it as a warning.
      - name: Unit tests
        timeout-minutes: 50
        run: |
          python3 .github/scripts/run-tests.py Unit --select "-only-testing:OwlLunaTests" -- \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600

      - name: UI smoke test
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          python3 .github/scripts/run-tests.py Smoke --beautify --select "-only-testing:OwlLunaUITests/SliceUITests/testVerticalSlice" -- \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600

      - name: Report
        if: always() && steps.ready.outcome == 'success'
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ matrix.device }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult

  ipados-18:
    name: Tests (iPadOS 18)
    # Nightly and by hand only: downloading the runtime makes it too slow for every push.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      NSUnbufferedIO: 'YES'
      # The newest iOS 18 runtime Apple offers (22G86). It has no arm64-only build.
      IOS_VERSION: '18.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: products
          path: ${{ runner.temp }}

      # The image keeps only the three newest iOS runtimes, so this one, about 9 GB, comes from Apple each night.
      - name: Install the iOS runtime
        timeout-minutes: 30
        run: |
          df -h /System/Volumes/Data
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION" -architectureVariant universal && break
            [ "$attempt" = 3 ] && exit 1
            sleep 60
          done
          xcrun simctl list runtimes

      - name: Boot the simulator
        run: python3 .github/scripts/boot-simulator.py ipad "$IOS_VERSION"

      - name: Unpack the products
        run: |
          tar -xf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        id: ready
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Unit tests
        timeout-minutes: 50
        run: |
          python3 .github/scripts/run-tests.py Unit --select "-only-testing:OwlLunaTests" -- \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600

      - name: Report
        if: always() && steps.ready.outcome == 'success'
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-ipados-18
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult

  release:
    name: Release builds
    # A nightly's commit was already built in Release when it was pushed.
    if: github.event_name != 'schedule'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build for iPad and iPhone
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/release-ios.log" \
            | xcbeautify --renderer github-actions

      # The Mac version is the same app built with Mac Catalyst; this catches code that only breaks there.
      - name: Build for the Mac
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/release-mac.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: release-build-logs
          retention-days: 14
          path: ${{ runner.temp }}/release-*.log

  nightly-check:
    name: Nightly check
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ui-suite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      nightly: ${{ steps.check.outputs.nightly }}
    steps:
      # A nightly skips its jobs when they passed on this commit in the last week; any API error runs them.
      - name: Check the last nightly on this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            get() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/$1"; }
            since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            ids=$(get "workflows/ci.yml/runs?event=schedule&status=completed&head_sha=$GITHUB_SHA&per_page=20" \
              | jq -r --arg since "$since" '.workflow_runs[] | select(.created_at >= $since) | .id') || ids=
            for id in $ids; do
              nightly=$(get "runs/$id/jobs?filter=latest&per_page=100" | jq -r '
                [.jobs[] | select((.name | startswith("UI suite")) or .name == "Tests (iPadOS 18)") | .conclusion]
                | if all(. == "skipped") then "skipped" elif all(. == "success") then "passed" else "failed" end') || break
              [ "$nightly" = skipped ] && continue
              if [ "$nightly" = passed ]; then
                run=false
                echo "::notice title=Nightly skipped::Its jobs passed on ${GITHUB_SHA:0:7} in run $id. Run the workflow by hand to repeat them."
              fi
              break
            done
          fi
          echo "nightly=$run" >> "$GITHUB_OUTPUT"

  ui-suite:
    name: UI suite (${{ matrix.part }})
    needs: [build, nightly-check]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.nightly-check.outputs.nightly == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      NSUnbufferedIO: 'YES'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each line of `runs` is one xcodebuild run. The tests that fail in it are run once more in a fresh test runner on
          # a rebooted simulator: a runner session that has gone slow waits a minute for the app to go idle on every step.
          - part: tests
            runs: |
              -only-testing:OwlLunaUITests -skip-testing:OwlLunaUITests/AccessibilityAuditUITests
            allowance: 900
            appearance: light
          # The simulator ignores XCUIDevice's appearance switch, so each part sets it before the tests start.
          - part: audits-light
            runs: |
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLight
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLightIncreaseContrast
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLargeText
            allowance: 2700
            appearance: light
          - part: audits-dark
            runs: |
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDark
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDarkIncreaseContrast
            allowance: 2700
            appearance: dark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: products
          path: ${{ runner.temp }}

      - name: Boot the simulator
        run: python3 .github/scripts/boot-simulator.py ipad

      - name: Unpack the products
        run: |
          tar -xf "$RUNNER_TEMP/products.tar" -C "$RUNNER_TEMP"
          echo "XCTESTRUN=$(ls "$RUNNER_TEMP"/Products/*.xctestrun)" >> "$GITHUB_ENV"

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Set the appearance
        run: xcrun simctl ui "$SIMULATOR_UDID" appearance ${{ matrix.appearance }}

      - name: UI tests
        env:
          RUNS: ${{ matrix.runs }}
          ALLOWANCE: ${{ matrix.allowance }}
          APPEARANCE: ${{ matrix.appearance }}
        run: |
          failed=0
          number=0
          while IFS= read -r selection; do
            [ -n "$selection" ] || continue
            number=$((number + 1))
            python3 .github/scripts/run-tests.py "UI-$number" --beautify --select "$selection" -- \
              -retry-tests-on-failure -test-iterations 2 \
              -test-timeouts-enabled YES -default-test-execution-time-allowance "$ALLOWANCE" < /dev/null || failed=1
          done <<< "$RUNS"
          exit $failed

      - name: Report
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/test-report.py "$RUNNER_TEMP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-${{ matrix.part }}-results
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult
