name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'LICENSE'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      ui-suite:
        description: Run the whole UI suite
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and tests (iPadOS ${{ matrix.ios }})
    # Xcode 27 preview image. There is no macos-27 label yet (October 2026); switch once it is generally available.
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ios: [latest, '18']
    steps:
      - uses: actions/checkout@v7

      - name: Boot an iPad simulator
        id: simulator
        uses: ./.github/actions/boot-ipad
        with:
          ios: ${{ matrix.ios }}

      - name: Check for the runtime
        if: steps.simulator.outputs.udid == ''
        run: |
          xcodebuild -version
          runtimes=$(xcrun simctl list runtimes available | grep '^iOS' | cut -d' ' -f1-2 | paste -sd, - | sed 's/,/, /g' || true)
          if [ "${{ matrix.ios }}" = latest ]; then
            echo "::error::No iOS simulator runtime is available on this runner."
            exit 1
          fi
          echo "::notice title=iPadOS ${{ matrix.ios }} skipped::This runner image has no iOS ${{ matrix.ios }} simulator runtime (it has ${runtimes:-none})."

      - name: Build
        id: build
        if: steps.simulator.outputs.udid != ''
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build-for-testing \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" \
            | xcbeautify --renderer github-actions

      - name: Wait for the simulator
        if: steps.build.outcome == 'success'
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Unit tests
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Unit.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/test.log" \
            | xcbeautify --renderer github-actions

      - name: UI smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaUITests/SliceUITests/testVerticalSlice \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/Smoke.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-ipados-${{ matrix.ios }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult

  iphone:
    name: Build and tests (iPhone)
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Boot an iPhone simulator
        id: simulator
        uses: ./.github/actions/boot-iphone

      - name: Build
        id: build
        run: |
          set -o pipefail
          test -n "$SIMULATOR_UDID" || { echo "::error::No iOS simulator runtime is available on this runner."; exit 1; }
          xcodebuild -version
          xcodebuild build-for-testing \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" \
            | xcbeautify --renderer github-actions

      - name: Wait for the simulator
        if: steps.build.outcome == 'success'
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Unit tests
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Unit.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/test.log" \
            | xcbeautify --renderer github-actions

      - name: UI smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:OwlLunaUITests/SliceUITests/testVerticalSlice \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -resultBundlePath "$RUNNER_TEMP/Smoke.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/smoke.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-iphone
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult

  release:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build Release with warnings as errors
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/release.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-build-log
          retention-days: 14
          path: ${{ runner.temp }}/release.log

  ui-suite:
    name: UI suite (${{ matrix.part }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ui-suite)
    runs-on: xcode-27
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests
            tests: -only-testing:OwlLunaUITests -skip-testing:OwlLunaUITests/AccessibilityAuditUITests
            allowance: 900
            appearance: light
          # The simulator ignores XCUIDevice's appearance switch, so each part sets it before the tests start.
          - part: audits-light
            tests: >-
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLight
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLightIncreaseContrast
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditLargeText
            allowance: 2700
            appearance: light
          - part: audits-dark
            tests: >-
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDark
              -only-testing:OwlLunaUITests/AccessibilityAuditUITests/testAuditDarkIncreaseContrast
            allowance: 2700
            appearance: dark
    steps:
      - uses: actions/checkout@v7

      - name: Boot an iPad simulator
        id: simulator
        uses: ./.github/actions/boot-ipad

      - name: Build
        run: |
          set -o pipefail
          test -n "$SIMULATOR_UDID" || { echo "::error::No iOS simulator runtime is available on this runner."; exit 1; }
          xcodebuild -version
          xcodebuild build-for-testing \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" \
            | xcbeautify --renderer github-actions

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Set the appearance
        run: xcrun simctl ui "$SIMULATOR_UDID" appearance ${{ matrix.appearance }}

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project OwlLuna.xcodeproj \
            -scheme OwlLuna \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            ${{ matrix.tests }} \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance ${{ matrix.allowance }} \
            -resultBundlePath "$RUNNER_TEMP/UI.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/ui.log" \
            | xcbeautify --renderer github-actions

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-${{ matrix.part }}-results
          retention-days: 14
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/UI.xcresult
